[pytest]
# Constrain discovery to our smoke-test directory so pytest doesn't try
# to run upstream OpenBB's /tests (gitignored from our quantedge-platform
# view; would require their full openbb-core install graph to even import).
testpaths = api/tests
python_files = test_*.py
asyncio_mode = auto
# Quiet output; -ra prints a short summary of skips/xfails at the end.
addopts = -ra --strict-markers
